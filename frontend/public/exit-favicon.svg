<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <mask id="doorMask">
      <rect width="100" height="100" fill="white" />
      <rect x="70" y="47" width="3" height="6" rx="1.5" fill="black" />
    </mask>
  </defs>
  
  <!-- Left frame -->
  <rect x="25" y="20" width="5" height="55" fill="#CDAA7D" />
  
  <!-- Top frame -->
  <rect x="25" y="20" width="30" height="5" fill="#CDAA7D" />
  
  <!-- Bottom floor/frame -->
  <rect x="22" y="77" width="40" height="3" fill="#CDAA7D" />
  
  <!-- Door panel with knob cutout -->
  <polygon points="55,25 75,20 75,80 55,75" fill="#CDAA7D" mask="url(#doorMask)" />
</svg>
